# Quality-gate configuration for the simplified Task 2 implementation.

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
files = [
    "loglik.py",
    "eda.py",
    "fit.py",
    "fit_k3.py",
    "diagnostics.py",
    "paths.py",
    "run_all.py",
]
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
